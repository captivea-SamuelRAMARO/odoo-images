# Builds CE+EE images for each supported Odoo version and pushes them to GHCR
# with a moving tag (e.g. 19.0) and an immutable dated tag (e.g. 19.0-20260728).
#
# This repo is the ONLY place that needs Enterprise access (ENTERPRISE_SSH_KEY).
# Runs weekly to track Enterprise fixes, and can be triggered manually.
#
# The image name (ghcr.io/<owner>/odoo-ee) is derived from the repo owner and
# forced to lowercase, since Docker requires repository names to be lowercase.

name: Build Odoo CE+EE images

on:
  schedule:
    - cron: "0 3 * * 1"      # every Monday 03:00 UTC
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: read
  packages: write             # push to GHCR

jobs:
  build:
    runs-on: ubuntu-latest    # default shell is bash here, so ${VAR,,} works

    strategy:
      fail-fast: false        # one version failing shouldn't cancel the others
      matrix:
        version: ["19.0", "18.0"]   # <-- add / remove supported Odoo versions

    # Avoid two overlapping builds of the same version (schedule + manual).
    concurrency:
      group: build-image-${{ matrix.version }}
      cancel-in-progress: false

    steps:
      - name: Checkout image repo (Dockerfile + .dockerignore)
        uses: actions/checkout@v4

      - name: Checkout Odoo Enterprise (${{ matrix.version }})
        uses: actions/checkout@v4
        with:
          repository: odoo/enterprise
          ref: ${{ matrix.version }}
          path: enterprise
          ssh-key: ${{ secrets.ENTERPRISE_SSH_KEY }}
          # depth 1: we only need the files at this ref, not the history.
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase owner + dated tag
        id: meta
        run: |
          # Docker requires lowercase repository names; the org/user login may
          # contain uppercase letters, so lowercase it here.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            ODOO_VERSION=${{ matrix.version }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/odoo-ee:${{ matrix.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/odoo-ee:${{ matrix.version }}-${{ steps.meta.outputs.date }}
          # Layer cache across runs (mostly the apt layer; Enterprise files
          # change every build so that layer is rebuilt anyway).
          cache-from: type=gha
          cache-to: type=gha,mode=max